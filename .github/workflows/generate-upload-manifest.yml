name: generate-upload-manifest

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/Hydrogen
      # need to cd into the directory for each command
      # possibly a better organization exists but this works for now
      - name: Install dependencies
        run: cd .github/generator && npm ci
      - name: Generate manifest.json
        run: cd .github/generator && src/generate-manifest.ts
      - name: Sync sample library to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
        run: |
          # Mirror the sample content (doctype folders at the repo root) into the
          # samples/ prefix of the config-library bucket. Exclude repo meta so
          # only document content is synced. --delete removes objects for
          # samples deleted from the repo.
          aws s3 sync . s3://template-library.sensible.so/samples/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "output/*" \
            --exclude ".gitignore" \
            --exclude ".DS_Store" \
            --exclude "README.md" \
            --cache-control "public, max-age=3600"
          # Upload the manifest last so it never references not-yet-synced files.
          aws s3 cp output/manifest_v2.json s3://template-library.sensible.so/samples/manifest_v2.json \
            --cache-control "public, max-age=3600" \
            --content-type application/json
